<style>/* Layout idea: a single phone-width column with a bottom tab bar; wide screens center it at 720px. */
:root{--bg:#f4f5f1;--card:#ffffff;--ink:#1c2826;--mut:#5f6d6a;--line:#dfe3dd;--acc:#0f766e;--acc-ink:#ffffff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--soft:#e9efec;

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.daynav>div{text-align:center;flex:1}.daynav p{margin:0;color:var(--mut);font-size:14px}

.ev .tm{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);line-height:1.35}.ev .tm b{color:var(--ink);font-size:14px}.ev .tm i{font-style:normal;margin-top:4px}
.sn{font-size:12px;font-weight:700;color:var(--sc);text-transform:uppercase;letter-spacing:.03em}[dir=rtl] .sn{text-transform:none;letter-spacing:0}

details summary{cursor:pointer;color:var(--mut);font-size:14px;padding:4px 0}

.sub{font-weight:600;font-size:14px;margin:8px 0 0}.tl{font-size:14px;padding-inline-start:20px;margin:6px 0}
.mks{display:flex;flex-direction:column;gap:6px}
.mk{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px;font-weight:700}
.mk[aria-pressed=true].mk-d{background:var(--ok);color:#fff;border-color:var(--ok)}.mk[aria-pressed=true].mk-h{background:var(--warn);color:#fff;border-color:var(--warn)}.mk[aria-pressed=true].mk-n{background:var(--bad);color:#fff;border-color:var(--bad)}
.ev.st-d{opacity:.82}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}.chip{min-width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card)}.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.wk{margin:6px 0 10px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;min-height:56px}
.prow.now{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.pd{display:flex;flex-direction:column;min-width:110px}.pd small{color:var(--mut)}
.dots{display:flex;gap:4px;flex:1}.dots i{width:10px;height:10px;border-radius:50%}
.pc{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}.tiles div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.tiles b{display:block;font-size:28px;font-variant-numeric:tabular-nums}.tiles span{color:var(--mut);font-size:14px}
.wbars{display:flex;gap:4px;align-items:flex-end;height:120px;margin-bottom:8px}.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.wb>div{flex:1;width:100%;background:var(--soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.wb i{display:block;width:100%;background:var(--acc)}.wb small{font-size:11px;color:var(--mut)}
.srow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.srow>span{width:42%;overflow-wrap:anywhere}.srow .bar i{background:var(--sc)}.srow b{font-variant-numeric:tabular-nums;width:56px;text-align:end}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
#nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{background:none;border:0;padding:10px 4px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:12px}#nav button.on{color:var(--acc);font-weight:700}#nav button:disabled{opacity:.4}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;inset-inline:16px;bottom:96px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;font-size:14px}#toast.on{opacity:1}
#confirm{position:fixed;inset-inline:16px;bottom:96px;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bad);padding:14px;border-radius:12px;display:none;z-index:9}#confirm.on{display:block}#confirm p{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.ev{grid-template-columns:72px 1fr auto;padding:10px}.pd{min-width:90px}}
/* --- Planny additions --- */
.si{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sn{display:flex;align-items:center;gap:6px}.sn .si{color:var(--sc)}
.badge{font-style:normal;background:var(--warn);color:#fff;border-radius:99px;padding:0 8px;font-size:11px;text-transform:none;letter-spacing:0}
.sec summary{display:flex;align-items:center;gap:8px}.sec summary .si{color:var(--sc)}
.hd .hr{display:flex;align-items:center;gap:6px}

.stepper li.on{background:var(--acc);color:var(--acc-ink);font-weight:700}.stepper li.dn span{background:var(--ok);color:#fff;border-color:var(--ok)}

.tpls{display:flex;flex-wrap:wrap;gap:8px}.chip.wide{width:auto;padding:0 14px}
.bz{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.seg label{flex-direction:column;cursor:pointer}.seg input{position:absolute;opacity:0}
.seg span{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);background:var(--bg);min-height:56px}.seg small{color:var(--mut);font-size:12px}
.seg input:checked+span{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}.seg input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.sl{list-style:none;padding:0;margin:0}.sl li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.sl .si{color:var(--sc)}.sl span{flex:1}.sl i{font-style:normal;color:var(--mut);font-size:13px}

.plot .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}.plot .wb em{font-style:normal;font-size:10px;color:var(--mut);height:14px;font-variant-numeric:tabular-nums}

.srow .si{margin-inline-end:6px;color:var(--sc);vertical-align:-3px}

.stepper li.on span{color:var(--acc);background:var(--acc-ink)}

.lk{margin-top:8px}.lk input{width:100%}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.bdg{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:14px;opacity:.7}.bdg.on{background:var(--soft);color:var(--ink);border-color:var(--acc);opacity:1;font-weight:600}

.cm{list-style:none;margin:8px 0 0;padding:0}.cm li{display:flex;gap:10px;padding:5px 0;font-size:15px;color:var(--mut)}.cm li.v2{color:var(--ink)}.cm li i{font-style:normal;width:18px;text-align:center}
textarea[data-ref]{width:100%}

  else if(a==='shareuse'){
    try{let c=document.getElementById('sh_in').value.trim();if(c.indexOf('PLN1:')!==0)throw 0;
      const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));if(!o||!o.p||!Array.isArray(o.s))throw 0;
      const keep=S.profile.start;S.profile={...defaultProfile(),...o.p,start:keep,pauses:S.profile.pauses};['busy','seasons'].forEach(k=>{if(!Array.isArray(S.profile[k]))S.profile[k]=[]});
      S.subjects=o.s.filter(r=>r&&r.id&&(r.cid?LIBMAP[r.cid]:Array.isArray(r.topics)));S.built=false;save();wz=1;render();toast(t('shareOk'))}
    catch(err){toast(t('shareBad'))}
  }
  else if(a==='tpause'){if(timer){if(timer.paused){timer.end=Date.now()+timer.left*1000;timer.paused=false}else{timer.left=(timer.end-Date.now())/1000;timer.paused=true}renderTimer()}}
  else if(a==='tstop'){timer=null;clearInterval(timerInt);renderTimer()}
  else if(a==='day'){selDate=addDays(selDate,+b.dataset.d);render()}
  else if(a==='gotoday'){selDate=null;render()}
  else if(a==='pw'){window._pw=+b.dataset.w;render()}
  else if(a==='openday'){selDate=b.dataset.d;view='today';render();window.scrollTo(0,0)}
  else if(a==='copyday'&&curDay){
    const L=S.lang;copyText('Planny · '+DAYS[L][dow(curDay.iso)]+' · '+fmtDate(curDay.iso,L)+'\n'+curDay.events.map(e=>fmtTime(e.start,L)+' – '+fmtTime(e.end,L)+'  '+pick(e.sub.name,L)+': '+evTitle(e)).join('\n'));toast(t('copiedDay'));
  }
  else if(a==='ics'){
    const P=getPlan(),r=makeICS(P,calRange);if(!r.n){toast(t('calNone'));return}
    try{const blob=new Blob([r.text],{type:'text/calendar'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='planny.ics';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(err){copyText(r.text);toast(t('copied'))}
  }
  else if(a==='rmc'){S.subjects=S.subjects.filter(r=>r.id!==b.dataset.id);save();render()}
  else if(a==='tpl'){
    const tp=TEMPLATES.find(x=>x.id===b.dataset.id),keepC=S.subjects.filter(r=>!r.cid);
    S.subjects=tp.items.map(id=>{const c=LIBMAP[id];return {id:c.id,cid:c.id,n:c.n,m:c.m,slot:c.slot,startPage:1,pages:c.kind==='quran'?2:3}}).concat(keepC);save();render();
  }
  else if(a==='addbusy'){p.busy.push({name:'',days:[0,1,2,3,4,5,6],start:'12:00',end:'13:00'});save();render()}
  else if(a==='rmbusy'){p.busy.splice(+b.dataset.i,1);save();render()}
  else if(a==='addpause'){const s=todayISO();p.pauses.push({from:s,to:addDays(s,6)});save();render()}
  else if(a==='rmpause'){p.pauses.splice(+b.dataset.i,1);save();render()}
  else if(a==='wnext'){wz=Math.min(3,wz+1);render();window.scrollTo(0,0)}
  else if(a==='wback'){wz=Math.max(1,wz-1);render();window.scrollTo(0,0)}
  else if(a==='mkprompt'){
    const goal=(draft.goal||draft.name).trim();if(!goal){document.getElementById('d_goal').focus();return}
    draft.prompt=buildPrompt({goal,n:draft.n,m:draft.m,weeks:S.profile.weeks,lang:S.lang});render();
    const el=document.getElementById('cpanel');if(el)el.scrollIntoView({block:'start'});
  }
  else if(a==='copyprompt'||a==='copyprompt2'){copyText(draft.prompt);toast(t('copied'))}
  else if(a==='paste'){
    let ok=false;
    try{const tx=await navigator.clipboard.readText();if(tx){draft.paste=tx;ok=true}}catch(err){}
    if(ok){render();const ta=document.getElementById('d_paste');if(ta)ta.scrollIntoView({block:'center'})}
    else{toast(t('pasteBlocked'));const ta=document.getElementById('d_paste');if(ta)ta.focus()}
  }
  else if(a==='addcustom'){
    const topics=parseTopics(draft.paste),name=(draft.name||draft.goal).trim().slice(0,60);
    if(!name){document.getElementById('d_name').focus();return}
    if(!topics.length){toast(t('noTopics'));return}
    S.subjects.push({id:'u'+Date.now(),cid:null,name,n:draft.n,m:draft.m,slot:'evening',topics});
    draft={name:'',goal:'',n:3,m:30,prompt:'',paste:''};save();render();
  }
  else if(a==='build'){if(!S.subjects.length){toast(t('needOne'));return}S.built=true;if(!S.builtAt)S.builtAt=todayISO();view='today';selDate=null;save();render();window.scrollTo(0,0);toast(t('built'))}
  else if(a==='copybackup'){copyText(JSON.stringify(S));S.lastBackup=todayISO();save();toast(t('copied'))}
  else if(a==='restore'){
    try{const j=JSON.parse(document.getElementById('bk').value);if(!j||j.v!==1||!j.profile)throw 0;S=norm(j);save();view=S.built?'today':'setup';wz=1;selDate=null;render();toast(t('restored'))}catch(err){toast(t('badBackup'))}
  }
  else if(a==='reset'){
    const bar=document.getElementById('confirm');bar.innerHTML='<p>'+t('resetAsk')+'</p><div class="row"><button class="ghost danger" data-act="reset2">'+t('yes')+'</button><button class="ghost" data-act="cancel">'+t('cancel')+'</button></div>';bar.classList.add('on');
  }
  else if(a==='reset2'){const l=S.lang;S=fresh();S.lang=l;save();view='setup';wz=1;document.getElementById('confirm').classList.remove('on');render()}
  else if(a==='cancel'){document.getElementById('confirm').classList.remove('on')}
  else if(a==='hideinstall'){S.hideInstall=true;save();render()}
  else if(a==='doinstall'&&deferred){deferred.prompt();try{await deferred.userChoice}catch(err){}deferred=null;render()}
  else if(a==='howinstall'){openSheet()}
  else if(a==='closesheet'){document.getElementById('sheet').classList.remove('on')}
});
function openSheet(){
  const el=document.getElementById('sheet');
  el.innerHTML='<div class="sh"><h3>'+t('install')+'</h3><p><b>'+t('iAndroid')+'</b><br>'+t('iAndroidT')+'</p><p><b>'+t('iIphone')+'</b><br>'+t('iIphoneT')+'</p><p><b>'+t('iPc')+'</b><br>'+t('iPcT')+'</p><button class="primary sm" data-act="closesheet">'+t('close')+'</button></div>';
  el.classList.add('on');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(view==='today'||view==='setup')render()});
window.addEventListener('appinstalled',()=>{deferred=null;S.hideInstall=true;save();render()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('evd')){if(d.open)EVOPEN.add(d.dataset.k);else EVOPEN.delete(d.dataset.k)}
  if(d.classList&&d.classList.contains('sec')){OPEN.touched=true;document.querySelectorAll('details.sec').forEach(x=>{if(x.open)OPEN.add(x.dataset.sid);else OPEN.delete(x.dataset.sid)})}},true);
document.getElementById('langbtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();render()});
document.getElementById('themebtn').addEventListener('click',()=>{S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();render();toast(t('theme')+': '+t(S.theme==='auto'?'tAuto':S.theme==='light'?'tLight':'tDark'))});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;view=b.dataset.v;if(view==='today')selDate=null;if(view==='setup')wz=1;render();window.scrollTo(0,0)}));
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){}
render();

</script></body></html>
