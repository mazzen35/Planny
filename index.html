<style>/* Layout idea: a single phone-width column with a bottom tab bar; wide screens center it at 720px. */
:root{--bg:#f4f5f1;--card:#ffffff;--ink:#1c2826;--mut:#5f6d6a;--line:#dfe3dd;--acc:#0f766e;--acc-ink:#ffffff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--soft:#e9efec;
 --f:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101615;--card:#18201f;--ink:#e6ecea;--mut:#9aa9a6;--line:#2b3735;--acc:#2dd4bf;--acc-ink:#06201d;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--soft:#1f2b29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101615;--card:#18201f;--ink:#e6ecea;--mut:#9aa9a6;--line:#2b3735;--acc:#2dd4bf;--acc-ink:#06201d;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--soft:#1f2b29;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:0 0 4px;text-wrap:balance}h3{font-size:16px;margin:0 0 10px}
.lead{color:var(--mut);margin:0 0 16px;max-width:65ch}.note{color:var(--mut);font-size:14px;margin:6px 0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);width:100%;min-height:42px}
textarea{resize:vertical}
.fl{font-size:14px;color:var(--mut);margin:14px 0 6px}.fl2{margin:12px 0}
.dcb{display:flex;flex-wrap:wrap;gap:6px}.dcb label{flex-direction:row;align-items:center}
.dcb input{position:absolute;opacity:0}.dcb span{display:block;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:var(--bg);min-width:48px;text-align:center;font-size:14px}
.dcb input:checked+span{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.dcb input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.sec{border-top:1px solid var(--line);padding:4px 0}.sec summary{cursor:pointer;padding:10px 0;font-weight:600;border-inline-start:4px solid var(--sc);padding-inline-start:10px}
.sec summary em,.crs em{font-style:normal;color:var(--mut);font-weight:400;font-size:13px;margin-inline-start:6px}
.crs{padding:8px 0 8px 0}.crs.on{background:var(--soft);border-radius:10px;padding:8px 10px;margin:4px 0}
.ck{display:flex;flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;justify-content:space-between}
label.ck{justify-content:flex-start}.ck input{width:20px;height:20px;accent-color:var(--acc)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ctl select{width:auto;min-width:130px}.mini{flex-direction:row;align-items:center;gap:6px}.mini input{width:84px}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap;margin:10px 0}
.btn,.ghost,.primary{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn{background:var(--soft)}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);width:100%;margin:0 0 16px;font-size:17px;min-height:52px}.primary.sm{width:auto;margin:12px 0 0}.primary:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--acc);padding:6px 0;font-weight:600;text-decoration:underline}
.cap .bar{height:10px}.cap.warn .bar i{background:var(--warn)}.cap.bad .bar i{background:var(--bad)}.cap.ok .bar i{background:var(--ok)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.daynav>div{text-align:center;flex:1}.daynav p{margin:0;color:var(--mut);font-size:14px}

[dir=rtl] .daynav button{transform:scaleX(-1)}
.banner{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.dprog{display:flex;align-items:center;gap:10px;margin:8px 0 14px;font-size:14px;color:var(--mut)}
.work{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);margin:0 0 10px;font-size:14px}
.empty{color:var(--mut);padding:24px 0;text-align:center}
.ev{display:grid;grid-template-columns:84px 1fr auto;gap:12px;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--sc);border-radius:14px;padding:12px;margin:0 0 10px;align-items:start}
.ev .tm{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);line-height:1.35}.ev .tm b{color:var(--ink);font-size:14px}.ev .tm i{font-style:normal;margin-top:4px}
.sn{font-size:12px;font-weight:700;color:var(--sc);text-transform:uppercase;letter-spacing:.03em}[dir=rtl] .sn{text-transform:none;letter-spacing:0}
.tt{font-weight:600;margin:2px 0;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--mut);font-size:14px;padding:4px 0}
.steps{margin:6px 0;padding-inline-start:20px;font-size:14px}.steps li{margin:4px 0}.mn{color:var(--mut);white-space:nowrap}

.sub{font-weight:600;font-size:14px;margin:8px 0 0}.tl{font-size:14px;padding-inline-start:20px;margin:6px 0}
.mks{display:flex;flex-direction:column;gap:6px}
.mk{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px;font-weight:700}

.ev.st-d{opacity:.82}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}.chip{min-width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card)}.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.wk{margin:6px 0 10px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;min-height:56px}
.prow.now{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.pd{display:flex;flex-direction:column;min-width:110px}.pd small{color:var(--mut)}
.dots{display:flex;gap:4px;flex:1}.dots i{width:10px;height:10px;border-radius:50%}
.pc{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}.tiles div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.tiles b{display:block;font-size:28px;font-variant-numeric:tabular-nums}.tiles span{color:var(--mut);font-size:14px}
.wbars{display:flex;gap:4px;align-items:flex-end;height:120px;margin-bottom:8px}.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.wb>div{flex:1;width:100%;background:var(--soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}.wb i{display:block;width:100%;background:var(--acc)}.wb small{font-size:11px;color:var(--mut)}
.srow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.srow>span{width:42%;overflow-wrap:anywhere}.srow .bar i{background:var(--sc)}.srow b{font-variant-numeric:tabular-nums;width:56px;text-align:end}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
#nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{background:none;border:0;padding:10px 4px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:12px}#nav button.on{color:var(--acc);font-weight:700}#nav button:disabled{opacity:.4}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;inset-inline:16px;bottom:96px;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;font-size:14px}#toast.on{opacity:1}
#confirm{position:fixed;inset-inline:16px;bottom:96px;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bad);padding:14px;border-radius:12px;display:none;z-index:9}#confirm.on{display:block}#confirm p{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.ev{grid-template-columns:72px 1fr auto;padding:10px}.pd{min-width:90px}}

function windowsFor(p,d,rest){
  const wake=toMin(p.wake),sleep=toMin(p.sleep),w=[];
  const isWork=p.workDays.includes(d)&&!rest;
  const ms=wake+p.morningBuffer;
  if(isWork){
    const me=toMin(p.workStart)-p.commute-20;
    if(me-ms>=20)w.push({k:'morning',s:ms,e:me});
    const es=toMin(p.workEnd)+p.commute+p.windDown,ee=sleep-30;
    if(ee-es>=20)w.push({k:'evening',s:es,e:ee});
  }else{
    const me=toMin(p.offMorningEnd);
    if(me-ms>=20)w.push({k:'morning',s:ms,e:me});
    const es=toMin(p.offEveningStart),ee=sleep-30;
    if(ee-es>=20)w.push({k:'evening',s:es,e:ee});
  }
  return w.map(x=>({...x,cur:x.s}));
}
function weeklyCapacity(p){let t=0;for(let d=0;d<7;d++){if(p.restDays.includes(d))continue;windowsFor(p,d,false).forEach(w=>t+=w.e-w.s)}return t}
function weeklyDemand(subs){return subs.reduce((a,s)=>a+s.n*(s.m+GAP),0)}
function tryPlace(day,s){
  const ws=day.wins;if(!ws.length)return false;
  let order=s.slot==='morning'?['morning','evening']:s.slot==='evening'?['evening','morning']:null;
  let list=order?order.map(k=>ws.find(w=>w.k===k)).filter(Boolean):ws.slice().sort((a,b)=>(b.e-b.cur)-(a.e-a.cur));
  for(const w of list){if(w.cur+s.m<=w.e){const st=w.cur;w.cur=st+s.m+GAP;day.events.push({sid:s.id,start:st,end:st+s.m,sub:s});return true}}
  return false;
}

    return '<div class="srow" style="--sc:'+secOf(s.sec).color+'"><span>'+esc(pick(s.name,L))+'</span><div class="bar"><i style="width:'+p+'%"></i></div><b>'+d+'/'+ev.length+'</b></div>'}).join('');
  return h;
}
const DUR=[15,20,30,40,45,60,90];
function selHtml(opts,val,attrs,lab){return '<select '+attrs+' aria-label="'+esc(lab)+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(String(o[0])===String(val)?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'}
function vSetup(){
  const L=S.lang,p=S.profile;
  const dayCbs=(name,arr)=>'<div class="dcb">'+[0,1,2,3,4,5,6].map(d=>'<label><input type="checkbox" data-f="'+name+'" value="'+d+'"'+(arr.includes(d)?' checked':'')+'><span>'+DAYS[L][d].slice(0,L==='ar'?3:3)+'</span></label>').join('')+'</div>';
  let h='<h2>'+t('s_title')+'</h2><p class="lead">'+t('s_intro')+'</p>';
  h+='<section class="card"><h3>'+t('s_sched')+'</h3><div class="grid">';
  h+='<label>'+t('startDate')+'<input type="date" data-f="start" value="'+p.start+'"></label>';
  h+='<label>'+t('weeks')+'<input type="number" min="4" max="26" data-f="weeks" value="'+p.weeks+'"></label>';
  h+='<label>'+t('wake')+'<input type="time" data-f="wake" value="'+p.wake+'"></label>';
  h+='<label>'+t('sleepT')+'<input type="time" data-f="sleep" value="'+p.sleep+'"></label>';
  h+='<label>'+t('workStart')+'<input type="time" data-f="workStart" value="'+p.workStart+'"></label>';
  h+='<label>'+t('workEnd')+'<input type="time" data-f="workEnd" value="'+p.workEnd+'"></label>';
  h+='<label>'+t('commuteL')+'<input type="number" min="0" max="180" step="5" data-f="commute" value="'+p.commute+'"></label>';
  h+='<label>'+t('windL')+'<input type="number" min="0" max="240" step="5" data-f="windDown" value="'+p.windDown+'"></label></div>';
  h+='<p class="fl">'+t('workDays')+'</p>'+dayCbs('workDays',p.workDays)+'<p class="fl">'+t('restDays')+'</p>'+dayCbs('restDays',p.restDays)+'</section>';
  h+='<section class="card"><h3>'+t('s_subj')+'</h3>';
  SECTIONS.forEach((sec,si)=>{
    const courses=LIB.filter(c=>c.sec===sec.id),customs=S.subjects.filter(r=>!r.cid&&sec.id==='custom');
    if(!courses.length&&!customs.length)return;
    const nsel=S.subjects.filter(r=>r.cid&&LIBMAP[r.cid].sec===sec.id).length+customs.length;
    h+='<details class="sec" data-sid="'+sec.id+'"'+(OPEN.has(sec.id)||(!OPEN.touched&&(si===0||nsel))?' open':'')+' style="--sc:'+sec.color+'"><summary>'+esc(pick(sec,L))+(nsel?' <em>'+nsel+'</em>':'')+'</summary>';
    courses.forEach(c=>{
      const rec=S.subjects.find(r=>r.cid===c.id);
      h+='<div class="crs'+(rec?' on':'')+'"><label class="ck"><input type="checkbox" data-act="subj" data-c="'+c.id+'"'+(rec?' checked':'')+'><span>'+esc(pick(c.name,L))+'</span></label>';
      if(rec){
        h+='<div class="ctl">'+selHtml([1,2,3,4,5,6,7].map(n=>[n,n+' × '+t('perWeek')]),rec.n,'data-act="rn" data-id="'+rec.id+'"',t('perWeek'))+selHtml(DUR.map(m=>[m,m+' '+t('mins')]),rec.m,'data-act="rm" data-id="'+rec.id+'"',t('mins'))+selHtml([['morning',t('morning')],['evening',t('evening')],['any',t('anySlot')]],rec.slot||c.slot,'data-act="rs" data-id="'+rec.id+'"',t('pickSlot'));
        if(c.kind==='quran'||c.kind==='qread')h+='<label class="mini">'+t('startPage')+'<input type="number" min="1" max="604" data-act="sp" data-id="'+rec.id+'" value="'+(rec.startPage||1)+'"></label><label class="mini">'+t('pagesPer')+'<input type="number" min="1" max="20" data-act="pg" data-id="'+rec.id+'" value="'+(rec.pages||(c.kind==='quran'?2:3))+'"></label>';
        h+='</div>';
      }
      h+='</div>';
    });
    customs.forEach(r=>{
      h+='<div class="crs on"><div class="ck"><span>'+esc(r.name)+' <em>'+t('custom')+' · '+r.topics.length+'</em></span><button class="link" data-act="rmc" data-id="'+r.id+'">'+t('remove')+'</button></div><div class="ctl">'+selHtml([1,2,3,4,5,6,7].map(n=>[n,n+' × '+t('perWeek')]),r.n,'data-act="rn" data-id="'+r.id+'"',t('perWeek'))+selHtml(DUR.map(m=>[m,m+' '+t('mins')]),r.m,'data-act="rm" data-id="'+r.id+'"',t('mins'))+'</div></div>';
    });
    h+='</details>';
  });
  h+='</section>'+customPanel();
  h+=capBlock();
  h+='<button class="primary" data-act="build"'+(S.subjects.length?'':' disabled')+'>'+(S.built?t('rebuild'):t('build'))+'</button>';
  h+='<section class="card"><h3>'+t('backup')+'</h3><p class="note">'+t('backupNote')+'</p><div class="row"><button class="ghost" data-act="copybackup">'+t('copyBackup')+'</button></div><label class="fl2">'+t('restore')+'<textarea id="bk" rows="3"></textarea></label><div class="row"><button class="ghost" data-act="restore">'+t('restoreBtn')+'</button><button class="ghost danger" data-act="reset">'+t('reset')+'</button></div></section>';
  return h;
}
function capBlock(){
  const subs=S.subjects.map(resolveSubject),d=weeklyDemand(subs),c=weeklyCapacity(S.profile),r=c?d/c:9;
  const learn=subs.filter(s=>s.kind==='study'||s.kind==='lang').length;
  const cls=r>1?'bad':r>.8?'warn':'ok',msg=r>1?t('capOver'):r>.8?t('capTight'):t('capOk');
  return '<section class="card cap '+cls+'"><h3>'+t('cap')+'</h3><div class="bar"><i style="width:'+Math.min(100,Math.round(r*100))+'%"></i></div><p>'+t('capLine',{d:fmtDur(d,S.lang),c:fmtDur(c,S.lang)})+' <b>'+msg+'</b></p>'+(learn>3?'<p class="note">'+t('many',{n:learn})+'</p>':'')+'</section>';
}
function customPanel(){
  const L=S.lang,topics=parseTopics(draft.paste);
  const link=(u,l,cls)=>'<a class="btn '+cls+'" href="'+u+'" target="_blank" rel="noopener" data-act="copyprompt">'+l+'</a>';
  let h='<section class="card" id="cpanel"><h3>'+t('c_title')+'</h3><p class="note">'+t('c_intro')+'</p>';
  h+='<label class="fl2">'+t('c_name')+'<input type="text" id="d_name" value="'+esc(draft.name)+'"></label>';
  h+='<label class="fl2">'+t('c_goal')+'<textarea id="d_goal" rows="2" placeholder="'+esc(t('c_goalPh'))+'">'+esc(draft.goal)+'</textarea></label>';
  h+='<div class="grid"><label>'+t('perWeek')+'<select id="d_n">'+[1,2,3,4,5,6,7].map(n=>'<option'+(n===draft.n?' selected':'')+'>'+n+'</option>').join('')+'</select></label><label>'+t('mins')+'<select id="d_m">'+DUR.map(m=>'<option'+(m===draft.m?' selected':'')+'>'+m+'</option>').join('')+'</select></label></div>';
  h+='<button class="ghost" data-act="mkprompt">'+t('mkPrompt')+'</button>';
  if(draft.prompt){
    const q=encodeURIComponent(draft.prompt);
    h+='<p class="note">'+t('c_step2')+'</p><textarea id="d_prompt" rows="4" readonly>'+esc(draft.prompt)+'</textarea><div class="row wrap">'+link('https://chatgpt.com/?q='+q,t('openGPT'),'')+link('https://claude.ai/new?q='+q,t('openClaude'),'')+link('https://gemini.google.com/app',t('openGem'),'')+'<button class="ghost" data-act="copyprompt2">'+t('copyP')+'</button></div>';
  }
  h+='<label class="fl2">'+t('c_step3')+'<textarea id="d_paste" rows="6">'+esc(draft.paste)+'</textarea></label><div class="row"><button class="ghost" data-act="paste">'+t('pasteBtn')+'</button><span id="d_cnt" class="note">'+(topics.length?t('topicsFound',{n:topics.length}):t('noTopics'))+'</span></div>';
  h+='<button class="primary sm" data-act="addcustom">'+t('addSubj')+'</button></section>';
  return h;
}
function render(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  document.title=t('app');
  const keep=window.scrollY;let body='',P=null;
  if(view!=='setup'&&S.built){P=getPlan();body=view==='today'?vToday(P):view==='plan'?vPlan(P):vProgress(P);if(P.overflow&&view==='today')body='<p class="banner">'+t('overflow',{n:P.overflow})+'</p>'+body}
  else{view='setup';body=vSetup()}
  document.getElementById('app').innerHTML=body;
  document.getElementById('langbtn').textContent=t('lang');
  document.getElementById('ttl').textContent=t('app');
  document.querySelectorAll('#nav button').forEach(b=>{const v=b.dataset.v;b.querySelector('span').textContent=t(v);b.classList.toggle('on',v===view);b.disabled=!S.built&&v!=='setup'});
  window.scrollTo(0,keep);
}
function updatePreview(){const n=parseTopics(draft.paste).length,el=document.getElementById('d_cnt');if(el)el.textContent=n?t('topicsFound',{n}):t('noTopics')}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='d_name')draft.name=el.value;else if(el.id==='d_goal')draft.goal=el.value;else if(el.id==='d_paste'){draft.paste=el.value;updatePreview()}
});
document.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f,a=el.dataset.act,p=S.profile;
  if(el.id==='d_n'){draft.n=+el.value;return}if(el.id==='d_m'){draft.m=+el.value;return}
  if(f){
    if(f==='workDays'||f==='restDays'){p[f]=[...document.querySelectorAll('[data-f="'+f+'"]:checked')].map(x=>+x.value)}
    else if(f==='weeks'||f==='commute'||f==='windDown'){p[f]=Math.max(0,+el.value||0);if(f==='weeks')p.weeks=Math.min(26,Math.max(4,p.weeks))}
    else if(el.value)p[f]=el.value;
    save();render();return;
  }
  const rec=S.subjects.find(r=>r.id===el.dataset.id);
  if(a==='subj'){
    const c=LIBMAP[el.dataset.c];
    if(el.checked)S.subjects.push({id:c.id,cid:c.id,n:c.n,m:c.m,slot:c.slot,startPage:1,pages:c.kind==='quran'?2:3});
    else S.subjects=S.subjects.filter(r=>r.cid!==c.id);
    save();render();return;
  }
  if(!rec)return;
  if(a==='rn')rec.n=+el.value;else if(a==='rm')rec.m=+el.value;else if(a==='rs')rec.slot=el.value;
  else if(a==='sp')rec.startPage=Math.min(604,Math.max(1,+el.value||1));else if(a==='pg')rec.pages=Math.min(20,Math.max(1,+el.value||1));
  save();render();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  const a=b.dataset.act;
  if(a==='mark'){const k=b.dataset.k,v=b.dataset.v;if(S.status[k]===v)delete S.status[k];else S.status[k]=v;save();render()}
  else if(a==='day'){selDate=addDays(selDate,+b.dataset.d);render()}
  else if(a==='gotoday'){selDate=null;render()}
  else if(a==='pw'){window._pw=+b.dataset.w;render()}
  else if(a==='openday'){selDate=b.dataset.d;view='today';render();window.scrollTo(0,0)}
  else if(a==='rmc'){S.subjects=S.subjects.filter(r=>r.id!==b.dataset.id);save();render()}
  else if(a==='mkprompt'){
    const goal=(draft.goal||draft.name).trim();if(!goal){document.getElementById('d_goal').focus();return}
    draft.prompt=buildPrompt({goal,n:draft.n,m:draft.m,weeks:S.profile.weeks,lang:S.lang});render();
    const el=document.getElementById('cpanel');if(el)el.scrollIntoView({block:'start'});
  }
  else if(a==='copyprompt'){copyText(draft.prompt);toast(t('copied'))}
  else if(a==='copyprompt2'){copyText(draft.prompt);toast(t('copied'))}
  else if(a==='paste'){
    let ok=false;
    try{const tx=await navigator.clipboard.readText();if(tx){draft.paste=tx;ok=true}}catch(err){}
    if(ok){render();const ta=document.getElementById('d_paste');if(ta)ta.scrollIntoView({block:'center'})}
    else{toast(t('pasteBlocked'));const ta=document.getElementById('d_paste');if(ta)ta.focus()}
  }
  else if(a==='addcustom'){
    const topics=parseTopics(draft.paste),name=(draft.name||draft.goal).trim().slice(0,60);
    if(!name){document.getElementById('d_name').focus();return}
    if(!topics.length){toast(t('noTopics'));return}
    S.subjects.push({id:'u'+Date.now(),cid:null,name,n:draft.n,m:draft.m,slot:'evening',topics});
    draft={name:'',goal:'',n:3,m:30,prompt:'',paste:''};save();render();
  }
  else if(a==='build'){if(!S.subjects.length){toast(t('needOne'));return}S.built=true;view='today';selDate=null;save();render();window.scrollTo(0,0);toast(t('built'))}
  else if(a==='copybackup'){copyText(JSON.stringify(S));toast(t('copied'))}
  else if(a==='restore'){
    try{const j=JSON.parse(document.getElementById('bk').value);if(!j||j.v!==1||!j.profile)throw 0;S=j;save();view=S.built?'today':'setup';selDate=null;render();toast(t('restored'))}catch(err){toast(t('badBackup'))}
  }
  else if(a==='reset'){
    const bar=document.getElementById('confirm');bar.innerHTML='<p>'+t('resetAsk')+'</p><div class="row"><button class="ghost danger" data-act="reset2">'+t('yes')+'</button><button class="ghost" data-act="cancel">'+t('cancel')+'</button></div>';bar.classList.add('on');
  }
  else if(a==='reset2'){const l=S.lang;S={v:1,lang:l,profile:defaultProfile(),subjects:[],status:{},built:false};save();view='setup';document.getElementById('confirm').classList.remove('on');render()}
  else if(a==='cancel'){document.getElementById('confirm').classList.remove('on')}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('sec')){OPEN.touched=true;document.querySelectorAll('details.sec').forEach(x=>{if(x.open)OPEN.add(x.dataset.sid);else OPEN.delete(x.dataset.sid)})}},true);
document.getElementById('langbtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();render()});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;view=b.dataset.v;if(view==='today')selDate=null;render();window.scrollTo(0,0)}));
render();

</script></body></html>
